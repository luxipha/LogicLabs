 <rect x="42" y="210" width="1420" height="1495" rx="22" fill="#fff" stroke="#dae4eb" stroke-width="2"/><text x="76" y="260" font-family="Arial, sans-serif" font-size="23" font-weight="700" fill="#526d80">BUILD THESE BLOCKS</text>
 <g transform="translate(85 295) scale(1.13)"><path d="M7 0 H25 l6 5 h20 l6 -5 H1103 q7 0 7 7 V35 q0 7 -7 7 H30 V84 H1103 q7 0 7 7 V95 q0 7 -7 7 H57 l-6 5 h-20 l-6 -5 H7 q-7 0 -7 -7 V7 q0 -7 7 -7 Z" fill="#a437c7" stroke="#17384f" stroke-opacity=".25" stroke-width="1.3"/><text x="14" y="27" font-family="Arial, sans-serif" font-size="23" font-weight="600" fill="#fff">on button </text><rect x="147" y="4" width="29.3" height="31" rx="14" fill="#fff" fill-opacity=".98"/><text x="155" y="27" font-family="Arial, sans-serif" font-size="23" font-weight="600" fill="#243b50">A</text><text x="182.3" y="27" font-family="Arial, sans-serif" font-size="23" font-weight="600" fill="#fff"> pressed</text><path d="M37 42 H55 l6 5 h20 l6 -5 H1103 q7 0 7 7 V77 q0 7 -7 7 H87 l-6 5 h-20 l-6 -5 H37 q-7 0 -7 -7 V49 q0 -7 7 -7 Z" fill="#1879d5" stroke="#17384f" stroke-opacity=".25" stroke-width="1.3"/><text x="44" y="69" font-family="Arial, sans-serif" font-size="23" font-weight="600" fill="#fff">show icon  </text><rect x="190.3" y="46" width="135.7" height="31" rx="14" fill="#fff" fill-opacity=".98"/><text x="198.3" y="69" font-family="Arial, sans-serif" font-size="23" font-weight="600" fill="#243b50">surprised</text></g>
 <rect x="1492" y="210" width="866" height="1495" rx="22" fill="#fff" stroke="#dae4eb" stroke-width="2"/><text x="1530" y="268" font-family="Arial, sans-serif" font-size="24" font-weight="700" fill="#c64818">LEARN</text><text x="1530" y="316" font-family="Arial, sans-serif" font-size="29" font-weight="600" fill="#19364d">Events: a button starts the program.</text><text x="1530" y="398" font-family="Arial, sans-serif" font-size="24" font-weight="700" fill="#1879d5">WHAT TO ADD</text><text x="1530" y="446" font-family="Arial, sans-serif" font-size="28" font-weight="400" fill="#19364d">Place a show-icon block inside</text><text x="1530" y="486" font-family="Arial, sans-serif" font-size="28" font-weight="400" fill="#19364d">the Button A event.</text><rect x="1518" y="548" width="814" height="45" rx="8" fill="#e7f3ed"/><text x="1534" y="578" font-family="Arial, sans-serif" font-size="24" font-weight="700" fill="#26704e">OBSERVE AFTER RUNNING</text><text x="1530" y="638" font-family="Arial, sans-serif" font-size="28" font-weight="700" fill="#26704e">•</text><text x="1556" y="638" font-family="Arial, sans-serif" font-size="28" font-weight="400" fill="#19364d">Before pressing A, the screen stays clear.</text><text x="1530" y="694" font-family="Arial, sans-serif" font-size="28" font-weight="700" fill="#26704e">•</text><text x="1556" y="694" font-family="Arial, sans-serif" font-size="28" font-weight="400" fill="#19364d">Press A: the surprised icon appears.</text><text x="1530" y="780" font-family="Arial, sans-serif" font-size="24" font-weight="700" fill="#7952a5">THINK &amp; EXPLAIN</text><text x="1530" y="828" font-family="Arial, sans-serif" font-size="28" font-weight="400" fill="#19364d">What tells the program to start?</text><rect x="1520" y="908" width="810" height="74" rx="12" fill="#edf4fa"/><text x="1540" y="954" font-family="Arial, sans-serif" font-size="25" font-weight="700" fill="#214e6a">PRESS A → ICON</text><text x="1530" y="1604" font-family="Arial, sans-serif" font-size="22" font-weight="400" fill="#536b7c">Build on the previous stage. Keep the earlier blocks.</text><text x="1530" y="1639" font-family="Arial, sans-serif" font-size="22" font-weight="400" fill="#536b7c">Run once at a time; wait before pressing A again.</text><text x="65" y="1762" font-family="Arial, sans-serif" font-size="23" font-weight="400" fill="#536b7c">MakeCode-style teaching blocks • M1 = motor port • ms = milliseconds • Read nested blocks from top to bottom</text></svg>