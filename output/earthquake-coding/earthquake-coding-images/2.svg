 <rect x="42" y="210" width="1420" height="1495" rx="22" fill="#fff" stroke="#dae4eb" stroke-width="2"/><text x="76" y="260" font-family="Arial, sans-serif" font-size="23" font-weight="700" fill="#526d80">BUILD THESE BLOCKS</text>
 <g transform="translate(85 295) scale(1.13)"><path d="M7 0 H25 l6 5 h20 l6 -5 H1103 q7 0 7 7 V35 q0 7 -7 7 H30 V270 H1103 q7 0 7 7 V281 q0 7 -7 7 H57 l-6 5 h-20 l-6 -5 H7 q-7 0 -7 -7 V7 q0 -7 7 -7 Z" fill="#a437c7" stroke="#17384f" stroke-opacity=".25" stroke-width="1.3"/><text x="14" y="27" font-family="Arial, sans-serif" font-size="23" font-weight="600" fill="#fff">on button </text><rect x="147" y="4" width="29.3" height="31" rx="14" fill="#fff" fill-opacity=".98"/><text x="155" y="27" font-family="Arial, sans-serif" font-size="23" font-weight="600" fill="#243b50">A</text><text x="182.3" y="27" font-family="Arial, sans-serif" font-size="23" font-weight="600" fill="#fff"> pressed</text><path d="M37 42 H55 l6 5 h20 l6 -5 H1103 q7 0 7 7 V77 q0 7 -7 7 H60 V252 H1103 q7 0 7 7 V263 q0 7 -7 7 H87 l-6 5 h-20 l-6 -5 H37 q-7 0 -7 -7 V49 q0 -7 7 -7 Z" fill="#478900" stroke="#17384f" stroke-opacity=".25" stroke-width="1.3"/><text x="44" y="69" font-family="Arial, sans-serif" font-size="23" font-weight="600" fill="#fff">repeat </text><rect x="137.10000000000002" y="46" width="29.3" height="31" rx="14" fill="#fff" fill-opacity=".98"/><text x="145.10000000000002" y="69" font-family="Arial, sans-serif" font-size="23" font-weight="600" fill="#243b50">3</text><text x="172.40000000000003" y="69" font-family="Arial, sans-serif" font-size="23" font-weight="600" fill="#fff"> times</text><path d="M67 84 H85 l6 5 h20 l6 -5 H1103 q7 0 7 7 V119 q0 7 -7 7 H117 l-6 5 h-20 l-6 -5 H67 q-7 0 -7 -7 V91 q0 -7 7 -7 Z" fill="#1879d5" stroke="#17384f" stroke-opacity=".25" stroke-width="1.3"/><text x="74" y="111" font-family="Arial, sans-serif" font-size="23" font-weight="600" fill="#fff">show icon  </text><rect x="220.3" y="88" width="135.7" height="31" rx="14" fill="#fff" fill-opacity=".98"/><text x="228.3" y="111" font-family="Arial, sans-serif" font-size="23" font-weight="600" fill="#243b50">surprised</text><path d="M67 126 H85 l6 5 h20 l6 -5 H1103 q7 0 7 7 V161 q0 7 -7 7 H117 l-6 5 h-20 l-6 -5 H67 q-7 0 -7 -7 V133 q0 -7 7 -7 Z" fill="#c82750" stroke="#17384f" stroke-opacity=".25" stroke-width="1.3"/><text x="74" y="153" font-family="Arial, sans-serif" font-size="23" font-weight="600" fill="#fff">play tone </text><rect x="207" y="130" width="95.80000000000001" height="31" rx="14" fill="#fff" fill-opacity=".98"/><text x="215" y="153" font-family="Arial, sans-serif" font-size="23" font-weight="600" fill="#243b50">High C</text><text x="308.8" y="153" font-family="Arial, sans-serif" font-size="23" font-weight="600" fill="#fff"> for </text><rect x="375.3" y="130" width="29.3" height="31" rx="14" fill="#fff" fill-opacity=".98"/><text x="383.3" y="153" font-family="Arial, sans-serif" font-size="23" font-weight="600" fill="#243b50">½</text><text x="410.6" y="153" font-family="Arial, sans-serif" font-size="23" font-weight="600" fill="#fff"> beat</text><path d="M67 168 H85 l6 5 h20 l6 -5 H1103 q7 0 7 7 V203 q0 7 -7 7 H117 l-6 5 h-20 l-6 -5 H67 q-7 0 -7 -7 V175 q0 -7 7 -7 Z" fill="#1879d5" stroke="#17384f" stroke-opacity=".25" stroke-width="1.3"/><text x="74" y="195" font-family="Arial, sans-serif" font-size="23" font-weight="600" fill="#fff">clear screen</text><path d="M67 210 H85 l6 5 h20 l6 -5 H1103 q7 0 7 7 V245 q0 7 -7 7 H117 l-6 5 h-20 l-6 -5 H67 q-7 0 -7 -7 V217 q0 -7 7 -7 Z" fill="#1879d5" stroke="#17384f" stroke-opacity=".25" stroke-width="1.3"/><text x="74" y="237" font-family="Arial, sans-serif" font-size="23" font-weight="600" fill="#fff">pause (ms) </text><rect x="220.3" y="214" width="55.900000000000006" height="31" rx="14" fill="#fff" fill-opacity=".98"/><text x="228.3" y="237" font-family="Arial, sans-serif" font-size="23" font-weight="600" fill="#243b50">200</text></g>
 <rect x="1492" y="210" width="866" height="1495" rx="22" fill="#fff" stroke="#dae4eb" stroke-width="2"/><text x="1530" y="268" font-family="Arial, sans-serif" font-size="24" font-weight="700" fill="#c64818">LEARN</text><text x="1530" y="316" font-family="Arial, sans-serif" font-size="29" font-weight="600" fill="#19364d">Sequences and repeat loops.</text><text x="1530" y="398" font-family="Arial, sans-serif" font-size="24" font-weight="700" fill="#1879d5">WHAT TO ADD</text><text x="1530" y="446" font-family="Arial, sans-serif" font-size="28" font-weight="400" fill="#19364d">Add a short tone, clear the screen,</text><text x="1530" y="486" font-family="Arial, sans-serif" font-size="28" font-weight="400" fill="#19364d">and pause. Repeat the warning 3 times.</text><rect x="1518" y="548" width="814" height="45" rx="8" fill="#e7f3ed"/><text x="1534" y="578" font-family="Arial, sans-serif" font-size="24" font-weight="700" fill="#26704e">OBSERVE AFTER RUNNING</text><text x="1530" y="638" font-family="Arial, sans-serif" font-size="28" font-weight="700" fill="#26704e">•</text><text x="1556" y="638" font-family="Arial, sans-serif" font-size="28" font-weight="400" fill="#19364d">Count three flashes and three beeps.</text><text x="1530" y="694" font-family="Arial, sans-serif" font-size="28" font-weight="700" fill="#26704e">•</text><text x="1556" y="694" font-family="Arial, sans-serif" font-size="28" font-weight="400" fill="#19364d">The motor stays still throughout.</text><text x="1530" y="780" font-family="Arial, sans-serif" font-size="24" font-weight="700" fill="#7952a5">THINK &amp; EXPLAIN</text><text x="1530" y="828" font-family="Arial, sans-serif" font-size="28" font-weight="400" fill="#19364d">Why do we put all four blocks inside</text><text x="1530" y="868" font-family="Arial, sans-serif" font-size="28" font-weight="400" fill="#19364d">repeat?</text><rect x="1520" y="948" width="810" height="74" rx="12" fill="#edf4fa"/><text x="1540" y="994" font-family="Arial, sans-serif" font-size="25" font-weight="700" fill="#214e6a">FLASH + BEEP → REPEAT × 3</text><text x="1530" y="1604" font-family="Arial, sans-serif" font-size="22" font-weight="400" fill="#536b7c">Build on the previous stage. Keep the earlier blocks.</text><text x="1530" y="1639" font-family="Arial, sans-serif" font-size="22" font-weight="400" fill="#536b7c">Run once at a time; wait before pressing A again.</text><text x="65" y="1762" font-family="Arial, sans-serif" font-size="23" font-weight="400" fill="#536b7c">MakeCode-style teaching blocks • M1 = motor port • ms = milliseconds • Read nested blocks from top to bottom</text></svg>