 <rect x="1492" y="210" width="866" height="1495" rx="22" fill="#fff" stroke="#dae4eb" stroke-width="2"/><text x="1530" y="268" font-family="Arial, sans-serif" font-size="24" font-weight="700" fill="#c64818">LEARN</text><text x="1530" y="316" font-family="Arial, sans-serif" font-size="29" font-weight="600" fill="#19364d">A while loop checks its condition every</text><text x="1530" y="356" font-family="Arial, sans-serif" font-size="29" font-weight="600" fill="#19364d">cycle.</text><text x="1530" y="438" font-family="Arial, sans-serif" font-size="24" font-weight="700" fill="#1879d5">WHAT TO ADD</text><text x="1530" y="486" font-family="Arial, sans-serif" font-size="28" font-weight="400" fill="#19364d">Put the entire shaking cycle inside</text><text x="1530" y="526" font-family="Arial, sans-serif" font-size="28" font-weight="400" fill="#19364d">while Shaking level &gt; 4. Decrease inside it.</text><rect x="1518" y="588" width="814" height="45" rx="8" fill="#e7f3ed"/><text x="1534" y="618" font-family="Arial, sans-serif" font-size="24" font-weight="700" fill="#26704e">OBSERVE AFTER RUNNING</text><text x="1530" y="678" font-family="Arial, sans-serif" font-size="28" font-weight="700" fill="#26704e">•</text><text x="1556" y="678" font-family="Arial, sans-serif" font-size="28" font-weight="400" fill="#19364d">M1 runs at 90%, 80%, 70%, 60%, then 50%.</text><text x="1530" y="734" font-family="Arial, sans-serif" font-size="28" font-weight="700" fill="#26704e">•</text><text x="1556" y="734" font-family="Arial, sans-serif" font-size="28" font-weight="400" fill="#19364d">It stops and pauses between cycles.</text><text x="1530" y="790" font-family="Arial, sans-serif" font-size="28" font-weight="700" fill="#26704e">•</text><text x="1556" y="790" font-family="Arial, sans-serif" font-size="28" font-weight="400" fill="#19364d">The final display is 4; M1 never runs at</text><text x="1556" y="830" font-family="Arial, sans-serif" font-size="28" font-weight="400" fill="#19364d">40%.</text><text x="1530" y="916" font-family="Arial, sans-serif" font-size="24" font-weight="700" fill="#7952a5">THINK &amp; EXPLAIN</text><text x="1530" y="964" font-family="Arial, sans-serif" font-size="28" font-weight="400" fill="#19364d">Why does the loop stop when the value</text><text x="1530" y="1004" font-family="Arial, sans-serif" font-size="28" font-weight="400" fill="#19364d">becomes 4?</text><rect x="1520" y="1084" width="810" height="74" rx="12" fill="#edf4fa"/><text x="1540" y="1130" font-family="Arial, sans-serif" font-size="25" font-weight="700" fill="#214e6a">9 → 8 → 7 → 6 → 5 | STOP AT 4</text><text x="1530" y="1604" font-family="Arial, sans-serif" font-size="22" font-weight="400" fill="#536b7c">Build on the previous stage. Keep the earlier blocks.</text><text x="1530" y="1639" font-family="Arial, sans-serif" font-size="22" font-weight="400" fill="#536b7c">Run once at a time; wait before pressing A again.</text><text x="65" y="1762" font-family="Arial, sans-serif" font-size="23" font-weight="400" fill="#536b7c">MakeCode-style teaching blocks • M1 = motor port • ms = milliseconds • Read nested blocks from top to bottom</text></svg>